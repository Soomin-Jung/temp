# prometheus-community/prometheus Helm values (v28+)
# PURPOSE: optional stage 2, AFTER separately approving vLLM metrics.
# Jobs are separated so DCGM=60s and vLLM=15s, with different allowlists.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

rbac:
  create: false
scrapeConfigs: null

server:
  automountServiceAccountToken: false
  retention: 14d
  ingress:
    enabled: false
  service:
    type: ClusterIP
  persistentVolume:
    enabled: true
    size: 20Gi
  global:
    scrape_interval: 60s
    evaluation_interval: 60s

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: federate-h200-dcgm
        scrape_interval: 60s
        scrape_timeout: 30s
        metrics_path: /federate
        honor_labels: true
        params:
          'match[]':
            - '{job="nvidia-dcgm-metrics",modelName=~".*H200.*",__name__=~"DCGM_FI_DEV_(GPU_UTIL|FB_USED|FB_FREE|POWER_USAGE|GPU_TEMP)"}'
        static_configs:
          - targets:
              - 'REPLACE_SOURCE_PROMETHEUS.monitoring.svc.cluster.local:9090'
            labels:
              instance: federation-source
        metric_relabel_configs:
          - action: keep
            source_labels: [job, namespace, modelName, __name__]
            separator: ';'
            regex: 'nvidia-dcgm-metrics;kube-system;.*H200.*;DCGM_FI_DEV_(GPU_UTIL|FB_USED|FB_FREE|POWER_USAGE|GPU_TEMP)'

      - job_name: federate-approved-vllm
        scrape_interval: 15s
        scrape_timeout: 10s
        metrics_path: /federate
        honor_labels: true
        params:
          'match[]':
            - '{job="kubernetes-vllm-instances",namespace="inference",model="APPROVED_MODEL",__name__=~"vllm:(num_requests_running|num_requests_waiting|prompt_tokens_total|generation_tokens_total)"}'
            - '{job="kubernetes-vllm-pd-engines",namespace="inference",model="APPROVED_MODEL",__name__=~"vllm:(num_requests_running|num_requests_waiting|prompt_tokens_total|generation_tokens_total)"}'
        static_configs:
          - targets:
              - 'REPLACE_SOURCE_PROMETHEUS.monitoring.svc.cluster.local:9090'
            labels:
              instance: federation-source
        metric_relabel_configs:
          # The OR is within one keep rule (not two keep rules in sequence).
          - action: keep
            source_labels: [job, namespace, model, __name__]
            separator: ';'
            regex: 'kubernetes-vllm-(instances|pd-engines);inference;APPROVED_MODEL;vllm:(num_requests_running|num_requests_waiting|prompt_tokens_total|generation_tokens_total)'
